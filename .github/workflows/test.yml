name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Run tests (SQLite)
        run: python -m pytest -q --tb=short

      - name: Run tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://copilot:ci-only-password@127.0.0.1:5432/copilot_test
        run: python -m pytest -q --tb=short

      - name: Docker build check
        run: docker build -t financial-copilot:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          npm ci
          pip install -r ../requirements-dev.lock

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Browser tests (Chrome)
        env:
          E2E_PYTHON: python
        run: npx playwright test
