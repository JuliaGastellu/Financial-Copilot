version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - SQLITE_PATH=/app/data/app.db
      - CHROMA_DIR=/app/data/chroma
      - OFFLINE_MODE=true
    volumes:
      - copilot_data:/app/data
    restart: unless-stopped

volumes:
  copilot_data:
